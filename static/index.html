<!doctype html>
<head>
  <meta charset="utf-8" />
  <title>telepathy testing</title>
  <script src="/client.js" defer></script>
</head>

<body>
  <h1>Same Word Telepathy</h1>
    <!-- <label id="playerNameField">
   Player Name: <input id="name" placeholder="Player" required />
   </label> -->
   <strong id="playerNameDisplay" style="display: none;"></strong>
   
   <div id="joinDiv">
    <h2>Join Game</h2>
    <form id="joinForm">
      <label id="playerNameField">
        Player Name: <input id="name" placeholder="Player" required />
      </label>
      <button id="joinBtn">Join Game</button>
    </form>
   </div>

  <div id="status"></div> <!--this is currently nothing, but can add text to the div in js-->

  <div id="game" style="display:none;"> <!--keep display hidden until game starting-->
    <div>Category: <span id="category"></span></div>
    <div>Round: <span id="round"></span> / <span id="tries"></span></div>
    <div>Players: <span id="playerList"></span></div>
    <div>Guessed: <span id="guessedList"></span></div>
    <div id="roundGuesses"></div> <!-- Display round guesses here -->

    <!-- <div style="margin-top:0.5rem;"> -->
      <input id="guessInput" placeholder="Enter your guess" />
      <button id="sendGuessBtn">Send Guess</button>
    <!-- </div> -->

    <h3>Messages</h3>
    <div id="messages"></div>
  </div>

</body>
</html>
